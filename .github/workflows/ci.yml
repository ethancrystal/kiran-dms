name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activity-log-check:
    name: activity-log-check (ACTIVITY.md Appendix C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check ACTIVITY.md discipline
        env:
          # Owner-maintained, newline-separated list of supplier identifiers (Appendix C rule 5).
          # Lives only in GitHub Actions secrets; never committed.
          KIRAN_SENSITIVE_TERMS: ${{ secrets.KIRAN_SENSITIVE_TERMS }}
        run: node scripts/activity-log-check.mjs "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

  db-tests:
    name: migrations + RLS matrix (local Supabase stack)
    runs-on: ubuntu-latest
    env:
      # Local CLI stack only: fixed, public development credentials, not a secret.
      KIRAN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.113.0
      # Real Postgres + GoTrue (the auth schema, auth.uid(), auth.jwt()). `supabase start`
      # applies supabase/migrations exactly as `supabase db push` would on a hosted project.
      - name: Start Supabase (db + auth only)
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm db:test
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  typecheck:
    name: typecheck + service-role scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Workspace package tests, e.g. the Excel import dry-run (packages/import, P0-02).
      - run: pnpm -r --if-present test
      # Production build of the web app, so the client bundle itself can be scanned (H-18).
      # Placeholder public settings only; no real project is contacted at build time.
      - name: build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: pnpm -C apps/web build
      # Key names anywhere in apps/ and packages/ source, key values in the built bundle; fails
      # closed on unreadable paths (council audit 2026-10-27, finding 1).
      - name: service-role key must never reach client code (H-18)
        run: node scripts/service-role-scan.mjs --bundle apps/web/.next/static
