name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activity-log-check:
    name: activity-log-check (ACTIVITY.md Appendix C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check ACTIVITY.md discipline
        run: node scripts/activity-log-check.mjs "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

  db-tests:
    name: migrations + RLS matrix (shadow database)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.6.1.054
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KIRAN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:test

  typecheck:
    name: typecheck + service-role scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: service-role key must never reach client code (H-18)
        run: |
          if grep -rnE "SUPABASE_SERVICE_ROLE_KEY|service_role" apps/web/app apps/web/components apps/web/lib 2>/dev/null | grep -v "server-only"; then
            echo "service_role reference found in client-reachable paths"; exit 1
          fi
          echo "no service_role references in client paths"
