name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  activity-log-check:
    name: activity-log-check (ACTIVITY.md Appendix C)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check ACTIVITY.md discipline
        env:
          # Owner-maintained, newline-separated list of supplier identifiers (Appendix C rule 5).
          # Lives only in GitHub Actions secrets; never committed.
          KIRAN_SENSITIVE_TERMS: ${{ secrets.KIRAN_SENSITIVE_TERMS }}
        run: node scripts/activity-log-check.mjs "${{ github.event.pull_request.base.sha || github.event.before }}" HEAD

  db-tests:
    name: migrations + RLS matrix (local Supabase stack)
    runs-on: ubuntu-latest
    env:
      # Local CLI stack only: fixed, public development credentials, not a secret.
      KIRAN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      # Real Postgres + GoTrue (the auth schema, auth.uid(), auth.jwt()). `supabase start`
      # applies supabase/migrations exactly as `supabase db push` would on a hosted project.
      # The runner's outbound connections can take a port in the stack's range (seen: 54324, address already in use). Keep the range out of the ephemeral pool.
      - name: Reserve the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      - name: Start Supabase (db + auth only)
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - run: pnpm db:test
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  typecheck:
    name: typecheck + service-role scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Workspace package tests, e.g. the Excel import dry-run (packages/import, P0-02).
      - run: pnpm -r --if-present test
      # Production build of the web app, so the client bundle itself can be scanned (H-18).
      # Placeholder public settings only; no real project is contacted at build time.
      - name: build web app
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: pnpm -C apps/web build
      # Key names anywhere in apps/ and packages/ source, key values in the built bundle; fails
      # closed on unreadable paths (council audit 2026-10-27, finding 1).
      - name: service-role key must never reach client code (H-18)
        run: node scripts/service-role-scan.mjs --bundle apps/web/.next/static

  lint:
    name: lint + format (Biome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SPEC.md §8 (MJ L-0136). Files listed as legacy in biome.jsonc are excused from
      # formatting until they are cleaned up; every other file must pass.
      - run: pnpm lint

  dependency-audit:
    name: dependency advisories (doc 06 10.8, H-18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A high or critical advisory fails unless an unexpired, reasoned exception exists
      # (docs/security/audit-exceptions.json). Moderate and low advisories never fail.
      - run: pnpm audit --json --prod | node scripts/dependency-audit.mjs

  secret-scan:
    name: secret scan (doc 06 10.8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned release v8.30.1 (tag commit 83d9cd6). The canary uses a token
      # generated at run time in RUNNER_TEMP. No token is written into this repo.
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Canary proves the scanner fails on a generated token
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/gitleaks"
          dir="$RUNNER_TEMP/gitleaks-canary"
          rm -rf "$dir"
          mkdir -p "$dir"
          git -C "$dir" init -q
          git -C "$dir" config user.email ci@example.com
          git -C "$dir" config user.name ci
          token="ghp_$(openssl rand -hex 18)"
          printf 'GITHUB_TOKEN=%s\n' "$token" > "$dir/leak.txt"
          unset token
          git -C "$dir" add leak.txt
          git -C "$dir" commit -q -m canary
          set +e
          "$bin" detect --source "$dir" --redact --no-banner
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "canary was clean; the scanner is broken"
            exit 1
          fi
          echo "canary failed closed"
      - name: gitleaks detect
        run: |
          bin="$RUNNER_TEMP/gitleaks"
          "$bin" detect --config .gitleaks.toml --redact --no-banner

  e2e:
    name: rep PWA browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      # Builds the web app with placeholder public settings and runs apps/web/e2e (SPEC.md §9).
      # No real Supabase project is contacted.
      - run: pnpm -C apps/web test:e2e
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-stack:
    name: office browser tests (Playwright, local Supabase stack)
    runs-on: ubuntu-latest
    env:
      # Local CLI stack only: fixed, public development settings, not secrets.
      KIRAN_STACK_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      KIRAN_STACK_MAILPIT_URL: http://127.0.0.1:54324
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.113.0
      # Auth, PostgREST (through the API gateway) and the mail catcher stay up: the pages call the
      # real app.* functions with real sessions (execution map, gate G2). Migrations apply on start.
      # The runner's outbound connections can take a port in the stack's range (seen: 54324, address already in use). Keep the range out of the ephemeral pool.
      - name: Reserve the Supabase ports
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
      # The storage service is up too, so the journey uploads a product picture and reads it back through a signed
      # URL under the bucket's real policies (goal plan: "manager adds a product with a picture").
      - name: Start Supabase (db, auth, rest, gateway, mail, storage)
        run: supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      # Only the public URL and the publishable (anon) key leave the stack; no service-role key is read.
      - name: Public settings of the local stack
        run: |
          supabase status -o json > /tmp/stack.json
          echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r .API_URL /tmp/stack.json)" >> "$GITHUB_ENV"
          public_key="$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY' /tmp/stack.json)"
          printf 'NEXT_PUBLIC_SUPABASE_%s=%s\n' ANON_KEY "$public_key" >> "$GITHUB_ENV"
          rm /tmp/stack.json
      - name: Seed synthetic people
        run: node scripts/e2e-stack-seed.mjs apps/web/e2e-stack/.seed.json
      - run: pnpm -C apps/web exec playwright install --with-deps chromium
      - run: pnpm -C apps/web exec playwright test -c playwright.stack.config.ts --reporter=github,line
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-stack
          path: apps/web/playwright-report-stack
          retention-days: 7
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
