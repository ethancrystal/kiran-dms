name: agent-compliance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-policy-files:
    name: agent-policy-files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate required agent policy files and integration
        run: node scripts/agent-preflight.mjs --ci
      - name: Test preflight failure cases
        run: node --test scripts/agent-preflight.test.mjs
