\* Medium two-owner check: two managers, one subject, one consumer. Expect: no violation.
CONSTANTS
    Reps = {rep1}
    Managers = {mgr1, mgr2}
    Owners = {own1, own2}
    Requests = {r1, r2}
    Subjects = {s1}
    Consumers = {c1}
    MaxAmount = 2
    Thresholds = {1, 2}
    None = None
    RecheckAtUse = TRUE
    CheckCoverage = TRUE
    EnforceSingleUse = TRUE

SPECIFICATION Spec
SYMMETRY SymmAll
CONSTRAINT UsesBound
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    S1_MakerNeChecker
    S2_SingleUse
    S3_GatedActionCovered
    S4_CheckerLevelAtUse
    S5_WriteOffOwnerChecked
    S6_OnlyOfficeChecks
    S7_OneActionPerConsumer
    S8_RepKinds
    S9_DecidedHasChecker
    S10_DeciderRankCoversLevel
    S13_WriteOffDecidedByOwner
PROPERTIES
    P1_DecidedImmutable
    P2_UsesAppendOnly
    P3_LevelOnlyRises
