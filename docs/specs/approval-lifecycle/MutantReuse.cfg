\* Mutant: no single-use index. Expect: S2_SingleUse VIOLATED (one approval, two consumers).
CONSTANTS
    Reps = {rep1}
    Managers = {mgr1, mgr2}
    Owners = {own1}
    Requests = {r1, r2}
    Subjects = {s1, s2}
    Consumers = {c1, c2}
    MaxAmount = 2
    Thresholds = {1, 2}
    None = None
    RecheckAtUse = TRUE
    CheckCoverage = TRUE
    EnforceSingleUse = FALSE

SPECIFICATION Spec
SYMMETRY Symm
CONSTRAINT UsesBound
CHECK_DEADLOCK FALSE
INVARIANTS
    S2_SingleUse
