\* Mutant: no route re-check at use. Expect: S4_CheckerLevelAtUse VIOLATED (threshold lowered after a manager approves).
CONSTANTS
    Reps = {rep1}
    Managers = {mgr1, mgr2}
    Owners = {own1}
    Requests = {r1, r2}
    Subjects = {s1, s2}
    Consumers = {c1, c2}
    MaxAmount = 2
    Thresholds = {1, 2}
    None = None
    RecheckAtUse = FALSE
    CheckCoverage = TRUE
    EnforceSingleUse = TRUE

SPECIFICATION Spec
SYMMETRY Symm
CONSTRAINT UsesBound
CHECK_DEADLOCK FALSE
INVARIANTS
    S4_CheckerLevelAtUse
